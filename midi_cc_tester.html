<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MIDI CC Tester</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: #111318;
    color: #e6e8ec;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8a8f98; font-size: 12px; margin-bottom: 20px; }
  .panel {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #9aa2af;
    margin: 0 0 12px;
  }
  label { font-size: 12px; color: #b3b8c2; display: block; margin-bottom: 4px; }
  select, input[type="number"], input[type="text"] {
    background: #0f1115;
    border: 1px solid #333844;
    color: #e6e8ec;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  select:focus, input:focus { outline: 1px solid #5b8cff; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; min-width: 140px; }
  button {
    background: #2b3140;
    color: #e6e8ec;
    border: 1px solid #3a4152;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #353c4e; }
  button.primary { background: #3b63e0; border-color: #3b63e0; }
  button.primary:hover { background: #4a70e8; }
  button.danger { background: #5a2c30; border-color: #6b3438; }
  button.danger:hover { background: #6b3438; }
  input[type="range"] { width: 100%; accent-color: #5b8cff; }
  .val-display {
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    min-width: 40px;
    text-align: right;
  }
  .cc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .cc-btn {
    text-align: left;
    font-size: 11px;
    padding: 6px 8px;
    background: #14161c;
    border: 1px solid #262b34;
  }
  .cc-btn.active { border-color: #5b8cff; background: #1c2338; }
  #log {
    background: #0a0b0e;
    border: 1px solid #262b34;
    border-radius: 6px;
    height: 180px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    padding: 8px;
    white-space: pre-wrap;
    color: #9dd6a3;
  }
  .status { font-size: 12px; }
  .status.ok { color: #6fd68a; }
  .status.bad { color: #e07a7a; }
  .flex-sp { display: flex; justify-content: space-between; align-items: center; }
  .hint { font-size: 11px; color: #6f7684; margin-top: 4px; }
</style>
</head>
<body>

<h1>MIDI CC Tester</h1>
<div class="sub">Web MIDI API を使った機器検証用 CC / メッセージ送信ツール</div>

<div class="panel">
  <h2>MIDI出力</h2>
  <div class="row">
    <div class="field" style="flex:1;min-width:220px;">
      <label for="outSel">出力デバイス</label>
      <select id="outSel"></select>
    </div>
    <div class="field">
      <label for="chSel">チャンネル</label>
      <select id="chSel"></select>
    </div>
    <div class="field">
      <button id="refreshBtn">再スキャン</button>
    </div>
  </div>
  <div id="status" class="status bad">MIDIアクセス待機中…</div>
</div>

<div class="panel">
  <h2>Control Change (CC 0–127)</h2>
  <div class="row">
    <div class="field">
      <label for="ccNum">CC番号</label>
      <input type="number" id="ccNum" min="0" max="127" value="1">
    </div>
    <div class="field" style="flex:1;">
      <label for="ccVal">値 (0–127)</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="range" id="ccVal" min="0" max="127" value="0">
        <span id="ccValDisp" class="val-display">0</span>
      </div>
    </div>
    <div class="field">
      <button id="sendCcBtn" class="primary">CC送信</button>
    </div>
  </div>
  <div class="hint">下のグリッドをクリックするとCC番号を選択。スライダーを動かすとリアルタイム送信します。</div>
  <div class="cc-grid" id="ccGrid"></div>
</div>

<div class="panel">
  <h2>自動テスト</h2>
  <div class="row">
    <div class="field">
      <label for="sweepCc">対象CC番号</label>
      <input type="number" id="sweepCc" min="0" max="127" value="7">
    </div>
    <div class="field">
      <label for="sweepInterval">間隔(ms)</label>
      <input type="number" id="sweepInterval" min="10" max="2000" value="40">
    </div>
    <div class="field">
      <button id="sweepBtn">0→127→0 スイープ送信</button>
    </div>
    <div class="field">
      <button id="allCcBtn">全CC (0–127) に値64を1回ずつ送信</button>
    </div>
    <div class="field">
      <button id="stopBtn" class="danger">停止</button>
    </div>
  </div>
</div>

<div class="panel">
  <h2>その他メッセージ</h2>
  <div class="row">
    <div class="field">
      <label for="noteNum">Note (Note On/Off)</label>
      <input type="number" id="noteNum" min="0" max="127" value="60">
    </div>
    <div class="field">
      <label for="noteVel">Velocity</label>
      <input type="number" id="noteVel" min="0" max="127" value="100">
    </div>
    <div class="field">
      <button id="noteOnBtn">Note On</button>
      <button id="noteOffBtn">Note Off</button>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="pcNum">Program Change</label>
      <input type="number" id="pcNum" min="0" max="127" value="0">
    </div>
    <div class="field">
      <button id="pcBtn">PC送信</button>
    </div>
    <div class="field">
      <label for="pbVal">Pitch Bend (-8192〜8191)</label>
      <input type="range" id="pbVal" min="-8192" max="8191" value="0">
      <span id="pbValDisp" class="val-display">0</span>
    </div>
    <div class="field">
      <label for="atVal">Channel Pressure (Aftertouch)</label>
      <input type="range" id="atVal" min="0" max="127" value="0">
      <span id="atValDisp" class="val-display">0</span>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <button id="allNotesOffBtn">All Notes Off (CC123)</button>
    </div>
    <div class="field">
      <button id="resetCcBtn">Reset All Controllers (CC121)</button>
    </div>
    <div class="field">
      <button id="allSoundOffBtn">All Sound Off (CC120)</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="flex-sp">
    <h2 style="margin:0;">送信ログ</h2>
    <button id="clearLogBtn">クリア</button>
  </div>
  <div id="log"></div>
</div>

<script>
const CC_NAMES = {
  0:"Bank Select MSB",1:"Modulation",2:"Breath",4:"Foot Ctrl",5:"Portamento Time",
  6:"Data Entry MSB",7:"Volume",8:"Balance",10:"Pan",11:"Expression",
  12:"Effect Ctrl 1",13:"Effect Ctrl 2",16:"Gen Purpose 1",17:"Gen Purpose 2",
  18:"Gen Purpose 3",19:"Gen Purpose 4",32:"Bank Select LSB",64:"Sustain (Hold1)",
  65:"Portamento On/Off",66:"Sostenuto",67:"Soft Pedal",68:"Legato Footswitch",
  69:"Hold 2",70:"Sound Variation",71:"Resonance (Timbre)",72:"Release Time",
  73:"Attack Time",74:"Cutoff (Brightness)",75:"Decay Time",76:"Vibrato Rate",
  77:"Vibrato Depth",78:"Vibrato Delay",84:"Portamento Ctrl",91:"Reverb Depth",
  92:"Tremolo Depth",93:"Chorus Depth",94:"Detune Depth",95:"Phaser Depth",
  96:"Data Increment",97:"Data Decrement",98:"NRPN LSB",99:"NRPN MSB",
  100:"RPN LSB",101:"RPN MSB",120:"All Sound Off",121:"Reset All Ctrls",
  122:"Local Control",123:"All Notes Off",124:"Omni Off",125:"Omni On",
  126:"Mono On",127:"Poly On"
};

let midiAccess = null;
let output = null;
let sweepTimer = null;

const outSel = document.getElementById('outSel');
const chSel = document.getElementById('chSel');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const ccNum = document.getElementById('ccNum');
const ccVal = document.getElementById('ccVal');
const ccValDisp = document.getElementById('ccValDisp');
const ccGrid = document.getElementById('ccGrid');

for (let i = 1; i <= 16; i++) {
  const opt = document.createElement('option');
  opt.value = i - 1;
  opt.textContent = 'Ch ' + i;
  chSel.appendChild(opt);
}

function log(msg) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(ok, msg) {
  statusEl.className = 'status ' + (ok ? 'ok' : 'bad');
  statusEl.textContent = msg;
}

function currentChannel() {
  return parseInt(chSel.value || '0', 10);
}

function send(bytes, label) {
  if (!output) {
    log('送信失敗: 出力デバイス未選択');
    return;
  }
  try {
    output.send(bytes);
    log(`${label} -> [${bytes.map(b => b.toString(16).padStart(2,'0')).join(' ')}]`);
  } catch (e) {
    log('送信エラー: ' + e.message);
  }
}

function sendCC(cc, val) {
  const ch = currentChannel();
  send([0xB0 | ch, cc & 0x7F, val & 0x7F], `CC${cc} ch${ch+1} = ${val}`);
}

function sendNote(on, note, vel) {
  const ch = currentChannel();
  const status = (on ? 0x90 : 0x80) | ch;
  send([status, note & 0x7F, vel & 0x7F], `${on ? 'NoteOn' : 'NoteOff'} ch${ch+1} note${note} vel${vel}`);
}

function sendPC(prog) {
  const ch = currentChannel();
  send([0xC0 | ch, prog & 0x7F], `ProgramChange ch${ch+1} = ${prog}`);
}

function sendPitchBend(val) {
  const ch = currentChannel();
  const v = val + 8192;
  const lsb = v & 0x7F;
  const msb = (v >> 7) & 0x7F;
  send([0xE0 | ch, lsb, msb], `PitchBend ch${ch+1} = ${val}`);
}

function sendChannelPressure(val) {
  const ch = currentChannel();
  send([0xD0 | ch, val & 0x7F], `ChannelPressure ch${ch+1} = ${val}`);
}

function buildCcGrid() {
  ccGrid.innerHTML = '';
  for (let i = 0; i <= 127; i++) {
    const btn = document.createElement('button');
    btn.className = 'cc-btn';
    btn.dataset.cc = i;
    btn.textContent = `${i}${CC_NAMES[i] ? ' - ' + CC_NAMES[i] : ''}`;
    btn.addEventListener('click', () => {
      ccNum.value = i;
      highlightCcGrid();
    });
    ccGrid.appendChild(btn);
  }
}

function highlightCcGrid() {
  const sel = parseInt(ccNum.value, 10);
  [...ccGrid.children].forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.cc, 10) === sel);
  });
}

function populateOutputs() {
  outSel.innerHTML = '';
  if (!midiAccess) return;
  const outputs = [...midiAccess.outputs.values()];
  if (outputs.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = '(出力デバイスが見つかりません)';
    outSel.appendChild(opt);
    setStatus(false, 'MIDI出力デバイスが見つかりません');
    output = null;
    return;
  }
  outputs.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.id;
    opt.textContent = `${o.name} (${o.manufacturer || '?'})`;
    outSel.appendChild(opt);
  });
  output = outputs[0];
  setStatus(true, `接続OK: ${outputs.length}台の出力デバイス`);
}

function initMidi() {
  if (!navigator.requestMIDIAccess) {
    setStatus(false, 'このブラウザはWeb MIDI APIに対応していません（Chrome/Edge推奨）');
    return;
  }
  navigator.requestMIDIAccess({ sysex: false }).then(access => {
    midiAccess = access;
    populateOutputs();
    access.onstatechange = () => populateOutputs();
  }).catch(err => {
    setStatus(false, 'MIDIアクセス拒否: ' + err.message);
  });
}

outSel.addEventListener('change', () => {
  if (midiAccess) output = midiAccess.outputs.get(outSel.value) || null;
});

document.getElementById('refreshBtn').addEventListener('click', initMidi);

ccVal.addEventListener('input', () => {
  ccValDisp.textContent = ccVal.value;
  sendCC(parseInt(ccNum.value, 10), parseInt(ccVal.value, 10));
});
ccNum.addEventListener('change', highlightCcGrid);
document.getElementById('sendCcBtn').addEventListener('click', () => {
  sendCC(parseInt(ccNum.value, 10), parseInt(ccVal.value, 10));
});

document.getElementById('sweepBtn').addEventListener('click', () => {
  clearInterval(sweepTimer);
  const cc = parseInt(document.getElementById('sweepCc').value, 10);
  const interval = parseInt(document.getElementById('sweepInterval').value, 10);
  let v = 0, dir = 1;
  sweepTimer = setInterval(() => {
    sendCC(cc, v);
    v += dir;
    if (v >= 127) { v = 127; dir = -1; }
    else if (v <= 0 && dir === -1) { clearInterval(sweepTimer); sweepTimer = null; }
  }, interval);
});

document.getElementById('allCcBtn').addEventListener('click', () => {
  clearInterval(sweepTimer);
  let cc = 0;
  sweepTimer = setInterval(() => {
    sendCC(cc, 64);
    cc++;
    if (cc > 127) { clearInterval(sweepTimer); sweepTimer = null; }
  }, 30);
});

document.getElementById('stopBtn').addEventListener('click', () => {
  clearInterval(sweepTimer);
  sweepTimer = null;
  log('停止しました');
});

document.getElementById('noteOnBtn').addEventListener('click', () => {
  sendNote(true, parseInt(document.getElementById('noteNum').value, 10), parseInt(document.getElementById('noteVel').value, 10));
});
document.getElementById('noteOffBtn').addEventListener('click', () => {
  sendNote(false, parseInt(document.getElementById('noteNum').value, 10), 0);
});
document.getElementById('pcBtn').addEventListener('click', () => {
  sendPC(parseInt(document.getElementById('pcNum').value, 10));
});

const pbVal = document.getElementById('pbVal');
const pbValDisp = document.getElementById('pbValDisp');
pbVal.addEventListener('input', () => {
  pbValDisp.textContent = pbVal.value;
  sendPitchBend(parseInt(pbVal.value, 10));
});

const atVal = document.getElementById('atVal');
const atValDisp = document.getElementById('atValDisp');
atVal.addEventListener('input', () => {
  atValDisp.textContent = atVal.value;
  sendChannelPressure(parseInt(atVal.value, 10));
});

document.getElementById('allNotesOffBtn').addEventListener('click', () => sendCC(123, 0));
document.getElementById('resetCcBtn').addEventListener('click', () => sendCC(121, 0));
document.getElementById('allSoundOffBtn').addEventListener('click', () => sendCC(120, 0));

document.getElementById('clearLogBtn').addEventListener('click', () => { logEl.textContent = ''; });

buildCcGrid();
highlightCcGrid();
initMidi();
</script>
</body>
</html>
